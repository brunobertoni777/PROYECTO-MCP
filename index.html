<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente Las Varillas</title>
<style>
  :root{--bg:#0f172a;--line:rgba(255,255,255,.08);--txt:#e2e8f0;--mut:#94a3b8;--acc:#3b82f6;--acc2:#6366f1}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);
    background-image:radial-gradient(circle at 10% 20%,rgba(37,99,235,.14),transparent 40%),radial-gradient(circle at 90% 80%,rgba(139,92,246,.14),transparent 40%);
    display:flex;justify-content:center}
  .app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:1.4rem}
  header h1{margin:0;font-size:1.2rem}header h1 b{color:var(--acc)}
  .st{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block;margin-right:6px}
  .dot.ok{background:#22c55e;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  #msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  #msgs::-webkit-scrollbar{width:6px}#msgs::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
  .m{max-width:82%;padding:13px 18px;border-radius:22px;white-space:pre-wrap;line-height:1.6;font-size:.96rem;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .m.u{align-self:flex-end;background:var(--acc);border-bottom-right-radius:5px}
  .m.a{align-self:flex-start;background:rgba(30,41,59,.75);border:1px solid var(--line);border-bottom-left-radius:5px}
  .m.s{align-self:flex-start;color:var(--mut);font-style:italic;font-size:.82rem;padding:4px 8px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #60a5fa;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;margin-right:8px;vertical-align:-1px}
  @keyframes r{to{transform:rotate(360deg)}}
  .sug{display:flex;flex-wrap:wrap;gap:8px;padding:0 24px 14px}
  .sug button{font:inherit;font-size:.78rem;color:#93c5fd;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);border-radius:99px;padding:6px 14px;cursor:pointer;transition:.2s}
  .sug button:hover{background:rgba(59,130,246,.25)}
  form{display:flex;gap:10px;align-items:flex-end;padding:16px 24px 22px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;background:rgba(30,41,59,.65);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:13px 16px;font:inherit;font-size:.95rem;outline:none}
  textarea:focus{border-color:var(--acc)}
  .send{border:0;cursor:pointer;color:#fff;font:inherit;font-weight:600;padding:13px 22px;border-radius:14px;background:var(--acc);transition:.2s}
  .send:hover{background:#2563eb}.send:disabled{opacity:.4;cursor:not-allowed}
  .foot{text-align:center;color:#64748b;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">📜</div>
    <div>
      <h1>Las Varillas <b>Digital</b></h1>
      <div class="st"><span class="dot" id="dot"></span><span id="st">Conectando...</span></div>
    </div>
  </header>

  <div id="msgs"></div>
  <div class="sug" id="sug"></div>

  <form id="form">
    <textarea id="inp" rows="1" placeholder="Haz una pregunta sobre la historia de Las Varillas..." autofocus></textarea>
    <button class="send" id="send" type="submit">Enviar</button>
  </form>
  <div class="foot">Digital History Engine · Las Varillas MCP</div>
</div>

<script>
const WS_URL = "ws://localhost:8000/ws/chat";
const $ = id => document.getElementById(id);
let ws, busy = false, statusEl = null;

function addMsg(txt, cls){
  const m = document.createElement("div");
  m.className = "m " + cls; m.textContent = txt;
  $("msgs").appendChild(m); $("msgs").scrollTop = $("msgs").scrollHeight;
  return m;
}
function setStatus(txt){
  if (!txt){ statusEl && statusEl.remove(); statusEl = null; return; }
  if (!statusEl) statusEl = addMsg("", "s");
  statusEl.innerHTML = '<span class="spin"></span>';
  statusEl.append(txt);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}
function setBusy(v){ busy = v; $("send").disabled = v; }

function conectar(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $("dot").className = "dot ok"; $("st").textContent = "En línea"; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "status") { setStatus(m.message); return; }
    setStatus(null);
    addMsg(m.type === "error" ? "Error: " + m.message : m.content, "a");
    setBusy(false);
  };
  ws.onclose = () => {
    $("dot").className = "dot"; $("st").textContent = "Servidor sin conexión, reintentando...";
    setStatus(null); setBusy(false); setTimeout(conectar, 3000);
  };
}

function enviar(texto){
  texto = (texto || $("inp").value).trim();
  if (!texto || busy) return;
  if (!ws || ws.readyState !== WebSocket.OPEN){
    addMsg("El servidor no está disponible. Verifica que el backend esté corriendo (python backend/main.py).", "a");
    return;
  }
  $("sug").style.display = "none";
  addMsg(texto, "u"); setBusy(true); setStatus("Enviando mensaje...");
  ws.send(JSON.stringify({text: texto}));
  $("inp").value = ""; $("inp").style.height = "auto";
}

$("form").addEventListener("submit", e => { e.preventDefault(); enviar(); });
$("inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); enviar(); }
});
$("inp").addEventListener("input", e => {
  e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px";
});

addMsg("¡Hola! Soy tu asistente historiador de Las Varillas. Pregúntame lo que quieras sobre el origen de la ciudad.", "a");
["¿Cuándo llegó el tren?", "¿A qué postura suscribe Valter Dabbene?", "¿Qué dice el Centro de Estudios Parada KM 81?", "Dame un resumen de las tres teorías"].forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = q; b.onclick = () => enviar(q);
  $("sug").appendChild(b);
});

conectar();
</script>
</body>
</html>
